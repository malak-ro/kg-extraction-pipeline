[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kg-extraction-pipeline"
version = "0.1.0"
description = "Knowledge Graph construction from unstructured text using NLP & LLMs"
requires-python = ">=3.10"
readme = "README.md"

# Les dépendances restent dans requirements.txt (voir README) : ce fichier sert
# uniquement à rendre le projet installable (`pip install -e .`) et à centraliser
# la configuration des outils ci-dessous.

[tool.setuptools.packages.find]
include = ["src*", "config*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
disallow_untyped_defs = true
